<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />

    <title>MY CYBER LAB — Ethical Hacking Academy & Cyber Range</title>
    <meta name="description" content="Start from zero. Learn through missions. Practice safely. Master ethical hacking." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
      // Suppress benign development websocket reconnect notices in sandboxed preview iframe
      (function() {
        var origError = console.error;
        var origWarn = console.warn;
        console.error = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.join(' ');
          if (str.indexOf('[vite] failed to connect to websocket') !== -1 || str.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          origError.apply(console, arguments);
        };
        console.warn = function() {
          var args = Array.prototype.slice.call(arguments);
          var str = args.join(' ');
          if (str.indexOf('[vite] failed to connect to websocket') !== -1 || str.indexOf('WebSocket closed without opened') !== -1) {
            return;
          }
          origWarn.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(event) {
          if (event && event.reason) {
            var msg = typeof event.reason === 'string' ? event.reason : (event.reason.message || String(event.reason));
            if (msg && msg.indexOf('WebSocket') !== -1) {
              event.preventDefault();
              if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            }
          }
        });
      })();
    </script>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
